<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Usuarios</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- Alta -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>Agregar Usuario</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-item>
        <ion-label position="floating">DNI</ion-label>
        <ion-input [(ngModel)]="nuevoUsuario.dni"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Nombre</ion-label>
        <ion-input [(ngModel)]="nuevoUsuario.nombre"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Email</ion-label>
        <ion-input [(ngModel)]="nuevoUsuario.email"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Teléfono</ion-label>
        <ion-input [(ngModel)]="nuevoUsuario.telefono"></ion-input>
      </ion-item>

      <ion-button expand="block" color="success" (click)="agregarUsuario()">
        Agregar
      </ion-button>
    </ion-card-content>
  </ion-card>

  <!-- Edición -->
  <ion-card *ngIf="editando">
    <ion-card-header>
      <ion-card-title>Editar Usuario</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-item>
        <ion-label position="floating">Nombre</ion-label>
        <ion-input [(ngModel)]="usuarioEditando.nombre"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Email</ion-label>
        <ion-input [(ngModel)]="usuarioEditando.email"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Teléfono</ion-label>
        <ion-input [(ngModel)]="usuarioEditando.telefono"></ion-input>
      </ion-item>

      <ion-button expand="block" (click)="guardarEdicion()">Guardar</ion-button>
      <ion-button expand="block" fill="outline" color="medium" (click)="cancelarEdicion()">Cancelar</ion-button>
    </ion-card-content>
  </ion-card>

  <!-- Listado -->
  <ion-list>
    <ion-item *ngFor="let u of usuarios">
      <ion-label>
        <h2>{{ u.nombre }}</h2>
        <p>DNI: {{ u.dni }} • {{ u.email }} • {{ u.telefono }}</p>
      </ion-label>
      <ion-button fill="clear" color="primary" (click)="editarUsuario(u)">Editar</ion-button>
      <ion-button fill="clear" color="danger" (click)="eliminarUsuario(u.dni)">Eliminar</ion-button>
    </ion-item>
  </ion-list>

</ion-content>
